<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Checkout - Multiversal Void</title>
  <link rel="stylesheet" href="../assets/css/estilos.css" />
  <link rel="icon" href="../assets/imagens/favicon(MVC).png">
</head>
<body>

  <div class="container">
    <h2>Finalizar Pedido</h2>

    <div class="checkout-wrapper">

      <!-- RESUMO DO PEDIDO -->
      <div class="checkout-resumo">
        <h3>📦 Resumo do Pedido</h3>
        <div id="resumo-itens" class="resumo-itens">
          <!-- preenchido pelo JS -->
        </div>
        <p class="resumo-total">Total: <strong id="resumo-total">R$ 0,00</strong></p>
      </div>

      <!-- FORMULÁRIO -->
      <div class="contato-form checkout-form">
        <h3>📋 Seus Dados</h3>

        <label for="nome">Nome completo:</label>
        <input type="text" id="nome" placeholder="Ex: Ana Dimensão" required />

        <label for="email">E-mail:</label>
        <input type="email" id="email" placeholder="Ex: ana@multiverso.com" required />

        <h3 style="margin-top: 20px;">📍 Endereço de Entrega</h3>

        <label for="rua">Rua / Logradouro:</label>
        <input type="text" id="rua" placeholder="Ex: Rua das Galáxias, 42" required />

        <label for="bairro">Bairro:</label>
        <input type="text" id="bairro" placeholder="Ex: Portal Norte" required />

        <label for="cidade">Cidade:</label>
        <input type="text" id="cidade" placeholder="Ex: Nova Dimensão" required />

        <label for="estado">Estado:</label>
        <input type="text" id="estado" placeholder="Ex: CE" maxlength="2" required />

        <label for="cep">CEP:</label>
        <input type="text" id="cep" placeholder="Ex: 00000-000" maxlength="9" required />

        <div id="erro-checkout" class="erro-msg oculto"></div>

        <button id="btn-confirmar" class="btn-confirmar">
          Confirmar Pedido 🚀
        </button>
      </div>

    </div>
  </div>

  <script src="../assets/js/script.js"></script>
  <script src="../assets/js/checkout.js"></script>
</body>
</html>
