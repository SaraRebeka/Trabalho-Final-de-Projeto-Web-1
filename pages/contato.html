<!DOCTYPE html> 
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contato - Multiversal Void</title>
  <link rel="stylesheet" href="../assets/css/estilos.css" />
  <link rel="icon" href="../assets/imagens/favicon(MVC).png">
</head>
<body>

  <div class="container">
    <h2>Contato</h2>
    <p>Tem alguma dúvida, projeto ou ideia? Fale conosco!
      <br>
      Caso não receba uma confirmação automática, por favor, tente novamente. Se preferir, envie um e-mail diretamente para: <strong>multiversalvoidcompany@gmail.com</strong>
    </p><br>

    <section class="contato-form">
      <form action="#" method="post">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" required />

        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" required />

        <label for="mensagem">Mensagem:</label>
        <textarea id="mensagem" name="mensagem" rows="5" required></textarea>

        <button type="submit">Enviar</button>
      </form>
    </section>
  </div>

  <script src="../assets/js/script.js"></script>
</body>
</html>
